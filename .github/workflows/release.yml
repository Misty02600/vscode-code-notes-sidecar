name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and verify release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Validate and package
        run: npm run package

      - name: Prepare release assets
        shell: bash
        run: |
          asset="release/code-notes-sidecar-${RELEASE_VERSION}.vsix"
          mv release/code-notes-sidecar.vsix "${asset}"
          sha256sum "${asset}" > "${asset}.sha256"
          echo "VSIX_ASSET=${asset}" >> "${GITHUB_ENV}"

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              "$VSIX_ASSET" \
              "$VSIX_ASSET.sha256" \
              --target "$GITHUB_SHA" \
              --title "Code Notes Sidecar $RELEASE_VERSION" \
              --generate-notes
          fi

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Marketplace identity
        run: npx vsce verify-pat misty02600 --azure-credential

      - name: Publish to VS Code Marketplace with Microsoft Entra ID
        run: npx vsce publish --azure-credential --packagePath "$VSIX_ASSET" --skip-duplicate
